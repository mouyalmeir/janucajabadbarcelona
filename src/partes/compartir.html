<!doctype html>
<!-- Plantilla de la imagen para compartir (1200×630).
     Para regenerarla, con el servidor local en marcha:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --virtual-time-budget=5000 --screenshot=compartir.png \
       http://localhost:8787/src/partes/compartir.html
     y después: sips -s format jpeg -s formatOptions 82 compartir.png --out assets/img/compartir.jpg -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: system-ui, -apple-system, sans-serif; color: #f6efe0;
    background:
      radial-gradient(700px 420px at 50% 70%, rgba(255,180,80,.22), transparent 70%),
      radial-gradient(900px 500px at 20% -10%, rgba(126,166,255,.18), transparent 65%),
      linear-gradient(180deg, #0f1740, #060a1b 85%);
  }
  .stars { position: absolute; inset: 0; background-image:
    radial-gradient(1.4px 1.4px at 60px 50px, #fff, transparent), radial-gradient(1px 1px at 180px 120px, #fff, transparent),
    radial-gradient(1.6px 1.6px at 320px 40px, #ffe2a3, transparent), radial-gradient(1px 1px at 470px 90px, #fff, transparent),
    radial-gradient(1.3px 1.3px at 620px 30px, #fff, transparent), radial-gradient(1px 1px at 760px 70px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 900px 26px, #fff, transparent), radial-gradient(1px 1px at 1080px 60px, #ffe2a3, transparent),
    radial-gradient(1px 1px at 1150px 140px, #fff, transparent), radial-gradient(1.2px 1.2px at 240px 200px, #fff, transparent);
    opacity: .8; }
  .sky { position: absolute; left: 0; right: 0; bottom: 30px; height: 150px; }
  .sky svg { width: 100%; height: 100%; }
  .sky .far { fill: #111a40; } .sky .near { fill: #0b1130; } .sky .win { fill: #ffcf7a; opacity: .5; }
  .sill { position: absolute; left: 0; right: 0; bottom: 0; height: 32px; background: linear-gradient(180deg, #2b3157, #10163a); border-top: 1px solid rgba(242,196,109,.35); }
  /* Composición centrada: si WhatsApp recorta el centro en cuadrado, se ve igual de bien */
  .jan { position: absolute; left: 50%; bottom: 26px; width: 480px; transform: translateX(-50%); }
  .glow { position: absolute; left: 50%; bottom: 40px; width: 760px; height: 420px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(255,180,80,.32), transparent); }
  .copy { position: absolute; left: 0; right: 0; top: 30px; text-align: center; }
  .logo { width: 86px; display: block; margin: 0 auto 10px; filter: drop-shadow(0 0 18px rgba(255,190,90,.35)); }
  h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 96px; line-height: .95; letter-spacing: -2px; font-variation-settings: "opsz" 144; }
  h1 em { font-style: italic; font-weight: 500; background: linear-gradient(180deg, #ffe2a3, #ffab2e); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .12em; margin-right: -.12em; }
  .sub { margin: 10px 0 0; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 36px; color: #f2c46d; }
  .sub span { font-family: system-ui, -apple-system, sans-serif; font-style: normal; font-size: 26px; font-weight: 600; color: #f6efe0; }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="sky"><!--SKYLINE--></div>
  <div class="sill"></div>
  <div class="glow"></div>
  <img class="jan" src="janukia-8.svg" alt="">
  <div class="copy">
    <img class="logo" src="../../assets/img/jabad-barcelona.webp" alt="">
    <h1>Janucá <em>5787</em></h1>
    <p class="sub">Suma tu luz <span>· 4 – 12 dic 2026 · Barcelona</span></p>
  </div>
  <script>
    // inserta el skyline de la web
    fetch('skyline.svg').then(r => r.text()).then(t => { document.querySelector('.sky').innerHTML = t; });
  </script>
</body>
</html>
